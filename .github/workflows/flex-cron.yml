name: Flex schedule

on:
  schedule:
    # Every 15 minutes, off the top of the hour. GitHub delays and drops
    # schedule runs under load, especially at :00, and does not replay them.
    # One start is enough: each job takes one Sydney slot, then hands off.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      hop:
        description: Continuation index after a slot or a cancelled run
        required: false
        default: '0'

permissions:
  actions: write
  contents: read

# A second fire waits, and only one waiter is kept, so delayed schedules
# cannot stack jobs. The running job is left alone. A lost runner is
# recovered by the handoff job, which starts on a fresh runner.
concurrency:
  group: flex-sydney-schedule
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    # One hourly gap plus the two account checks. A hang is cancelled here
    # and the handoff job still runs.
    timeout-minutes: 90
    outputs:
      started: ${{ steps.mark.outputs.started }}
      handoff: ${{ steps.follow.outputs.handoff }}
      hop: ${{ steps.follow.outputs.hop }}
      reason: ${{ steps.follow.outputs.reason }}
      continue: ${{ steps.follow.outputs.continue }}
    steps:
      - name: Mark the follow job as started
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: Follow one Sydney Flex slot
        id: follow
        timeout-minutes: 80
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FLEX_SYNC_URL: https://options-jade.vercel.app/api/flex-sync
          FLEX_CRON_HOP: ${{ inputs.hop || '0' }}
        run: node scripts/flex-cron-run.js

  handoff:
    needs: follow
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hand off the rest of the Sydney day
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FOLLOW_STARTED: ${{ needs.follow.outputs.started }}
          FOLLOW_RESULT: ${{ needs.follow.result }}
          HANDOFF: ${{ needs.follow.outputs.handoff }}
          HOP_OUT: ${{ needs.follow.outputs.hop }}
          REASON: ${{ needs.follow.outputs.reason }}
          CONTINUE: ${{ needs.follow.outputs.continue }}
          HOP_IN: ${{ inputs.hop || '0' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: node scripts/flex-cron-handoff.js

name: Flex schedule

on:
  schedule:
    # Every 15 minutes, off the top of the hour. GitHub delays and drops
    # schedule runs under load, especially at :00, and does not replay them.
    # One start is enough: the job walks the rest of the Sydney day.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      hop:
        description: Continuation index after a job hits its time budget
        required: false
        default: '0'

permissions:
  actions: write
  contents: read

# A second fire waits, and only one waiter is kept, so delayed schedules
# cannot stack six-hour jobs. The running job is left alone: cancelling it
# would drop the slots it is still going to check.
concurrency:
  group: flex-sydney-schedule
  cancel-in-progress: false

jobs:
  flex:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs die at 6 hours. Exit before that and dispatch a
    # continuation so a late morning start still reaches the evening slots.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Follow the Sydney Flex schedule
        id: follow
        timeout-minutes: 340
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FLEX_SYNC_URL: https://options-jade.vercel.app/api/flex-sync
          FLEX_CRON_HOP: ${{ inputs.hop || '0' }}
        run: node scripts/flex-cron-run.js
      - name: Hand off the rest of the Sydney day
        if: steps.follow.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOP: ${{ steps.follow.outputs.hop }}
        run: |
          case "$HOP" in
            [1-9]) ;;
            *) echo "Refusing to hand off without a hop count" >&2; exit 1 ;;
          esac
          gh workflow run flex-cron.yml --ref "${{ github.event.repository.default_branch }}" -f "hop=${HOP}"
